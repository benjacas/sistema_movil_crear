<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6D5AE6" />
    <link rel="icon" href="/logo.png" />
    <title>CREAR — Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-primary-subtle">
    <div class="flex flex-col h-svh max-w-md mx-auto bg-white sm:shadow-card-md">

      <header id="app-header"></header>

      <!-- Contenido -->
      <main class="flex-1 overflow-y-auto bg-primary-subtle px-4 py-5 space-y-5 animate-fade-up">

        <div class="rounded-2xl p-5 shadow-card" style="background: linear-gradient(135deg, #1E1147, #6D5AE6)">
          <p class="text-white/60 text-xs font-medium">Hola,</p>
          <h2 id="saludo-nombre" class="text-white font-bold text-xl font-display mt-0.5">—</h2>
          <p id="saludo-grupos" class="text-white/50 text-xs mt-2">—</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white rounded-2xl border border-primary-light p-4 shadow-card">
            <p id="stat-grupos" class="text-2xl font-black text-primary">—</p>
            <p class="text-xs text-gray-400 mt-0.5">Grupos activos</p>
          </div>
          <div class="bg-white rounded-2xl border border-primary-light p-4 shadow-card">
            <p id="stat-cuotas-pendientes" class="text-2xl font-black text-amber-500">—</p>
            <p class="text-xs text-gray-400 mt-0.5">Cuotas pendientes</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-primary-light p-5 shadow-card">
          <p class="text-sm font-bold text-gray-800 mb-3">Última cuota</p>
          <div id="ultima-cuota" class="flex items-center justify-between">
            <p class="text-xs text-gray-400">Cargando...</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-primary-light p-5 shadow-card">
          <p class="text-sm font-bold text-gray-800 mb-3">Mis grupos</p>
          <ul id="lista-grupos" class="space-y-2">
            <li class="text-xs text-gray-400">Cargando...</li>
          </ul>
        </div>
      </main>

      <nav id="app-nav"></nav>
    </div>

    <script type="module" src="/src/home.js"></script>
  </body>
</html>
