<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6D5AE6" />
    <link rel="icon" href="/logo.png" />
    <title>CREAR — Notificaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-primary-subtle">
    <div class="flex flex-col h-svh max-w-md mx-auto bg-white sm:shadow-card-md">

      <header id="app-header"></header>

      <main class="flex-1 overflow-y-auto bg-primary-subtle px-4 py-5 space-y-3 animate-fade-up">
        <div class="flex items-center justify-between px-1">
          <p class="text-xs text-gray-400">Avisos institucionales y alertas automáticas.</p>
          <button id="btn-marcar-todas" class="hidden text-xs font-semibold text-primary hover:text-primary-dark whitespace-nowrap">
            Marcar todas
          </button>
        </div>
        <ul id="lista-notificaciones" class="space-y-2">
          <li class="text-xs text-gray-400 px-1">Cargando...</li>
        </ul>
      </main>

      <!-- Modal de detalle -->
      <div id="modal-notificacion" class="hidden fixed inset-0 z-20">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/40"></div>
        <div class="absolute inset-x-0 bottom-0 max-w-md mx-auto bg-white rounded-t-3xl p-6 pb-8 animate-fade-up">
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="flex items-center gap-3">
              <div id="modal-icono" class="w-9 h-9 rounded-full flex items-center justify-center font-bold shrink-0"></div>
              <div>
                <p id="modal-tipo" class="text-[10px] font-semibold uppercase tracking-wide text-gray-400"></p>
                <p id="modal-titulo" class="text-base font-bold text-gray-800"></p>
              </div>
            </div>
            <button id="btn-cerrar-modal" class="text-gray-300 hover:text-gray-500 text-xl leading-none px-1">✕</button>
          </div>
          <p id="modal-fecha" class="text-xs text-gray-400 mb-3"></p>
          <p id="modal-mensaje" class="text-sm text-gray-700 leading-relaxed"></p>
          <a id="modal-cta" href="#" class="hidden mt-5 w-full py-3 rounded-xl bg-primary text-white text-sm font-semibold text-center hover:bg-primary-dark transition-colors"></a>
        </div>
      </div>

      <nav id="app-nav"></nav>
    </div>

    <script type="module" src="/src/notificaciones.js"></script>
  </body>
</html>
